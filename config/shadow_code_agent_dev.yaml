# SWE-agent 配置文件 - Shadow Code Agent 开发环境
# 使用自定义 Docker 镜像并在本地 dev 分支上工作，最后提交 PR
#
# 使用方式：
# sweagent run \
#   --config config/shadow_code_agent_dev.yaml \
#   --agent.model.name="claude-sonnet-4-20250514" \
#   --problem_statement.github_url="https://github.com/jairuigou/shadow-code-agent/issues/1" \
#   --env.repo.path="/Users/jairui/repo/shadow-code-agent"

# 环境配置
env:
  # 仓库配置 - 使用本地路径
  repo:
    type: local
    base_commit: "HEAD"  # 使用当前 HEAD 作为基础，不重置
    # path 通过命令行 --env.repo.path 传入

  # Docker 部署配置
  deployment:
    type: docker
    image: python:3.11

    # 自定义 Docker 启动参数
    docker_args:
      # 挂载本地仓库目录（用于开发调试）
      - "-v"
      - "/Users/jairui/repo/shadow-code-agent:/workspace/test_bed"

      # 设置工作目录
      - "-w"
      - "/workspace/test_bed"

      # 资源限制（根据需要调整）
      - "--memory=8g"
      - "--cpus=4"
      - "--shm-size=2g"

    # Python 独立目录 (设置为 None 跳过构建)
    python_standalone_dir: null

    # 启动超时（给镜像足够启动时间）
    startup_timeout: 300.0
    pull: "missing"  # 只在本地不存在时拉取

  # 容器启动后执行的初始化命令
  post_startup_commands:
    - "cd /workspace/test_bed"
    - "git branch --show-current"
    - "echo 'Working on local repository'"

  # 启动命令超时
  post_startup_command_timeout: 120

# Agent 配置（使用默认结构）
agent:
  templates:
    system_template: |-
      你是一个软件开发助手，负责修复 GitHub issues。
      你正在使用 shadow-code-agent:dev 镜像，所有依赖已预装。
      当前工作目录：{{working_dir}}
      你在 dev 分支上进行修改。

    instance_template: |-
      <uploaded_files>
      {{working_dir}}
      </uploaded_files>

      我需要你帮助修复以下 GitHub issue：

      <pr_description>
      {{problem_statement}}
      </pr_description>

      仓库已在 {{working_dir}} 目录中，所有依赖项已预装。

      请按照以下步骤工作：
      1. 快速浏览相关代码
      2. 理解问题本质
      3. 创建最小化的修复
      4. 验证修复有效
      5. 使用 /submit 命令提交（会自动创建 PR）

    next_step_template: |-
      OBSERVATION:
      {{observation}}

    next_step_no_output_template: |-
      命令执行成功，没有输出。

  # 工具配置
  tools:
    env_variables:
      PAGER: cat
      MANPAGER: cat
      LESS: -R
      PIP_PROGRESS_BAR: 'off'
      TQDM_DISABLE: '1'
      GIT_PAGER: cat

    bundles:
      - path: tools/registry
      - path: tools/edit_anthropic
      - path: tools/review_on_submit_m

    enable_bash_tool: true
    parse_function:
      type: function_calling

  # 历史消息处理器
  history_processors:
    - type: cache_control
      last_n_messages: 2

# Actions 配置 - 自动创建 PR
actions:
  open_pr: true
  pr_config:
    # 如果已有提交引用该 issue，则跳过 PR 创建（推荐）
    skip_if_commits_reference_issue: true

  # 是否在本地应用 patch（对于本地仓库，这个选项会自动生效）
  apply_patch_locally: true
